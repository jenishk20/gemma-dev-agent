name: swe_agent_v5
model: gemma-4-31b-it-qat-w4a16-ct
# v5 = v2 exactly (28 calls, 8 min, which fit in 12 h and scored 0.15) with thinking capped at 1024 tokens per step instead of 4096, so each step is faster on L4.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
