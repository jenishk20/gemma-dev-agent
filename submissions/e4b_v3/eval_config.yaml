# e4b_v3 = official E4B baseline (0.05 on Kaggle) with 40 tool calls instead of 28. E4B is several times faster
# than 31B on L4, so 40 calls should still fit the 12 h run (31B v3 with 40 calls did not).
# Per-task budgets. The hidden test has ~120 tasks and a 12-hour limit in total.
# 8 min / 28 calls matches the public 0.22 config; lower limits scored worse (0.13).
evaluation:
  timeout_seconds: 240
  max_tool_calls: 40
  max_time_minutes: 8
  max_turns: 80
