name: swe_agent_teacher
model: gemma-4-e4b-it-qat-w4a16-ct
# LoRA trained on 116 solved Kimi runs (training/build_sft.py + train_lora.py); copied in by cluster/ood_eval_lora.sh
adapter: main_lora
# e4b_lora_v1: the teacher's v2 agent on E4B with the main_lora adapter. Name kept: ADK puts it in the prompt.
# v2 = baseline tools (graph search + analyzer sub-agent) + v1's step-by-step prompt with graph search in LOCATE.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
