# Per-task budgets. The scorer runs the ~120 hidden tasks ONE AT A TIME and the whole run must end within 12 hours
# (going over errors the submission), on 4x L4 where 31B is 2-3x slower than on our H200.
# v3 (40 calls, 8 min) finished on Kaggle but got no score, most likely because more tasks used their full
# 8 minutes and 120 x 8 min = 16 h went past the 12 h limit. v4 keeps 40 calls and cuts the clock to 5 minutes:
# worst case 120 x 5 min = 10 h, leaving about 2 h for sandbox setup.
evaluation:
  timeout_seconds: 240
  max_tool_calls: 40
  max_time_minutes: 5
  max_turns: 120
