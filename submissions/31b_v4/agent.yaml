name: swe_agent_v4
model: gemma-4-31b-it-qat-w4a16-ct
# v4 = v3 (40 tool calls) with a 5-minute clock instead of 8, so 120 tasks fit in the 12 h limit.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
