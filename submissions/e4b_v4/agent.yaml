name: swe_agent_teacher
model: gemma-4-e4b-it-qat-w4a16-ct
# e4b_v4 = e4b_tprompt: the 31B v2 agent (prompt, tools, analyzer sub-agent, T 0.6) on E4B, no adapter.
# Held-out 29 public tasks: 6 and 3 solved (official E4B baseline: 2, e4b_v2: 3).
# v2 = baseline tools (graph search + analyzer sub-agent) + v1's step-by-step prompt with graph search in LOCATE.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
