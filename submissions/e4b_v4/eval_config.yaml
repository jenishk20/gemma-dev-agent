# Same prompt, tools and agent name as the Kimi teacher runs (the adapter was trained on that exact text),
# on E4B. 28 tool calls like the teacher; 8 minutes per task (E4B on L4 is several times faster than 31B).
# Per-task budgets. The hidden test has ~120 tasks and a 12-hour limit in total.
evaluation:
  timeout_seconds: 240
  max_tool_calls: 28
  max_time_minutes: 8
  max_turns: 80
