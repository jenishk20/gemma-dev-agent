name: swe_agent_v1
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/system.md
# v1: same budgets and sampling as the baseline. Changes: a step-by-step prompt with a call plan
# (locate -> reproduce -> edit by call 12 -> verify -> submit), grep/sed over the graph tools,
# and no analyzer sub-agent (its tool calls count against the same 28-call budget).
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
generate_content_config: !include configs/sampling.yaml
