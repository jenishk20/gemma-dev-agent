# Teacher runs (tools/run_local_eval.py --teacher ...): the v2 agent with the same 28 tool calls the student gets,
# but 20 minutes, because a hosted model's speed says nothing about Gemma on L4. Temperature 0.6 so tries differ.
# Per-task budgets. The hidden test has ~120 tasks and a 12-hour limit in total.
# 8 min / 28 calls matches the public 0.22 config; lower limits scored worse (0.13).
evaluation:
  timeout_seconds: 240
  max_tool_calls: 28
  max_time_minutes: 20
  max_turns: 80
