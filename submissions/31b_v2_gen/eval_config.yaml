# Self-distillation data runs only (cluster/ood_selfgen.sh): 31b_v2 at temperature 0.7 so tries differ;
# prompt, tools, agent name and budgets are 31b_v2's, so the recorded text is what 31b_v2 sees.
# Per-task budgets. The hidden test has ~120 tasks and a 12-hour limit in total.
# 8 min / 28 calls matches the public 0.22 config; lower limits scored worse (0.13).
evaluation:
  timeout_seconds: 240
  max_tool_calls: 28
  max_time_minutes: 8
  max_turns: 80
