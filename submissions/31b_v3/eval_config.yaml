# Per-task budgets. The scorer runs the ~120 hidden tasks ONE AT A TIME and the whole run must end within 12 hours
# (going over errors the submission), on 4x L4 where 31B is 2-3x slower than on our H200.
# v3 keeps the 8-minute clock (same worst-case run time as v2, which finished) and only raises the tool-call
# cap 28 -> 40, so a task that is still making progress is stopped by the clock, not the counter.
evaluation:
  timeout_seconds: 240
  max_tool_calls: 40
  max_time_minutes: 8
  max_turns: 120
