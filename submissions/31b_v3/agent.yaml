name: swe_agent_v3
model: gemma-4-31b-it-qat-w4a16-ct
# v3 = v2 (baseline tools + step-by-step prompt) with 40 tool calls instead of 28, same 8-minute clock.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
