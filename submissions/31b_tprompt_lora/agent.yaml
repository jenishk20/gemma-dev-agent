name: swe_agent_teacher
model: gemma-4-31b-it-qat-w4a16-ct
# 31b_tprompt_lora: 31b_tprompt + adapter main_lora (31B trained on Kimi's solved runs); copied in on the cluster, never committed
adapter: main_lora
# v2 = baseline tools (graph search + analyzer sub-agent) + v1's step-by-step prompt with graph search in LOCATE.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
